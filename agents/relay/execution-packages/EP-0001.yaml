outcome:
  user_visible:
    - Advanced_Analysis has one durable V2.5 execution contract whose purpose, authority, issue state, tests, and next work can be recovered without chat.
  engineering:
    - Delivery-protocol migration changes no engineering method, numerical result, source authority, benchmark tolerance, route authorization, or release state.
context_capsule:
  product_goal: Establish trustworthy engineering-delivery custody before additional EMP.1/WRC or other engineering material work is authorized.
  roadmap_position: OBJ-001 / PHASE-001 / WP-001 is the sole RM-0002 executable frontier.
  why_this_work_exists: The repository has extensive legacy V2 chain evidence but no V2.5 execution contract; ODR-0001 adopts V2.5 while preserving existing engineering authority boundaries.
  current_architecture: agents/relay is the new V2.5 custody root; agents/chains remains read-only provenance; GitHub issues are coordination projections rather than roadmap authority.
  prior_owner_decisions:
    - ODR-0001 adopts engineering-pr-delivery-v2.5 and grants no material write authority.
    - The gamma/interpolation choice in #1834 remains Owner-reserved.
    - The authority-bearing resultHash choice in #1852 remains Owner-reserved.
  current_implementation_state: PR #1858 contains the INITIALIZING scaffold, full V2 inventory, RM-0002 roadmap transaction, PB-0002 progress basis, and migration reconciliation; product code is unchanged.
  known_problems:
    - AGENTS.md still names the older Common delivery protocol and canonical-v3 path wording.
    - ISSUE_GRAPH is still empty even though current EMP.1/WRC and infrastructure issues have been re-observed.
    - Common V2.5 conformance and cold-start execution have not yet been recorded on this exact EP basis.
  deliberate_non_goals:
    - Do not decide or implement gamma interpolation policy.
    - Do not decide or change resultHash semantics.
    - Do not alter engineering mechanics, standards evidence, benchmark values, tolerances, workflows, route authorization, code compliance, or release authority.
  terminology:
    V2: Legacy engineering-pr-delivery-v2 chain artifacts under agents/chains.
    V2.5: Repository-roadmap/EP/takeover protocol rooted at agents/relay.
    Owner-reserved: A choice requiring a separate explicit Owner decision before its engineering scope may change.
repository_discovery:
  - id: DSTEP-01
    action: VERIFY
    target: agents/relay/REPO_STATE.yaml
    question: Does repository state still route to EP-0001 on RM-0002 / WP-001?
    expected_outputs:
      - active EP id and path
      - roadmap id and revision
      - current work package
      - material authority
    receipt_required: true
    on_failure: Reconcile repository custody before any material execution.
  - id: DSTEP-02
    action: VERIFY_GIT
    target: live checkout
    question: Does the checked-out branch and material ancestry satisfy the EP git basis, and has main drifted from the observed base?
    expected_outputs:
      - checked-out branch
      - current HEAD
      - material-ref ancestry result
      - current main ref
      - base drift classification
    receipt_required: true
    on_failure: Keep material authority read-only and reconcile route or drift before execution.
  - id: DSTEP-03
    action: INSPECT
    targets:
      - agents/relay/migration/V2_INVENTORY.yaml
      - agents/relay/migration/MIGRATION_RECONCILIATION.yaml
      - agents/relay/roadmap/owner-decisions/ODR-0001.yaml
      - AGENTS.md
    question: Do the inventory, applied Owner decision, migration worksheet, and repository overlay support the bounded migration scope without implying engineering-authority changes?
    expected_outputs:
      - legacy evidence inventory basis
      - Owner decision effect
      - stale protocol-pointer finding
      - protected engineering boundaries
    receipt_required: true
    on_failure: Stop scope expansion and reconcile the migration contract before writing.
  - id: DSTEP-04
    action: VERIFY
    targets:
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1830
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1834
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1852
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1854
      - https://github.com/reallaksh19/Advanced_Analysis/issues/54
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1768
      - https://github.com/reallaksh19/Advanced_Analysis/issues/1775
    question: What are the currently verified GitHub states and coordination relationships for the migration-relevant open work?
    expected_outputs:
      - issue number and verified state for each target
      - ownership or dependency relationship supported by issue text
      - explicit separation of Owner decisions from actionable engineering or infrastructure work
    receipt_required: true
    on_failure: Leave uncertain issue states UNKNOWN in ISSUE_GRAPH and do not invent relationships.
