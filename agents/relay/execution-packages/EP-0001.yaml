report_contract:
  sections:
    - Executive state
    - Overall / phase / EP progress
    - Work completed
    - Files changed
    - Acceptance matrix
    - Tests and evidence
    - Quality findings
    - Known limitations
    - Owner decisions required
    - GitHub issue changes
    - Roadmap changes
    - Exact next actions
    - Successor EP
  payloads:
    - id: RPT-STATE
      section: Executive state
      sources: [REPO_STATE]
      required_fields: [relay_state, current_position, execution_state, material_authority, stop]
    - id: RPT-PROGRESS
      section: Overall / phase / EP progress
      sources: [PROGRESS, OVERALL_ROADMAP, EP]
      required_fields: [progress_basis, overall, phase, work_package, step, acceptance]
    - id: RPT-WORK
      section: Work completed
      sources: [EP, CP]
      required_fields: [completed_steps, implementation_result]
    - id: RPT-FILES
      section: Files changed
      sources: [CP]
      required_fields: [files_changed]
    - id: RPT-AC
      section: Acceptance matrix
      sources: [EP, PROGRESS, CP]
      required_fields: [criterion, status, percent, basis]
    - id: RPT-EVIDENCE
      section: Tests and evidence
      sources: [EP, CP, REPO_STATE]
      required_fields: [validation_id, obligation_class, status, basis_ref, not_run_reason]
    - id: RPT-QUALITY
      section: Quality findings
      sources: [EP, QRV, CP, REPO_STATE]
      required_fields: [quality_review, procedures, findings, disposition, execution_effect]
    - id: RPT-LIMITS
      section: Known limitations
      sources: [EP, CP, REPO_STATE]
      required_fields: [limitations, evidence_gaps, deferred_items]
    - id: RPT-OWNER
      section: Owner decisions required
      sources: [ODR, REPO_STATE]
      required_fields: [decision_required, pending_items, authority_effect]
    - id: RPT-ISSUES
      section: GitHub issue changes
      sources: [ISSUE_GRAPH, REPO_STATE]
      required_fields: [operations, relationships, projection_state]
    - id: RPT-ROADMAP
      section: Roadmap changes
      sources: [OVERALL_ROADMAP, ROADMAP_REVISION, PROGRESS]
      required_fields: [revision, topology_or_status_change, frontier_after, progress_basis_effect]
    - id: RPT-NEXT
      section: Exact next actions
      sources: [EP]
      required_fields: [ordered_actions, targets, inputs, tests, benchmarks, acceptance, expected_result, stop_conditions]
    - id: RPT-SUCCESSOR
      section: Successor EP
      sources: [CP, OVERALL_ROADMAP, REPO_STATE]
      required_fields: [successor_mode, next_frontier, ep_or_terminal_disposition]
checkpoint_contract:
  required: true
successor_relay:
  required: true
  duties:
    - reconcile current roadmap node
    - create checkpoint
    - update progress
    - update issue projection when applicable
    - compute next executable frontier
    - create successor EP when work continues
    - validate successor EP
    - run cold-start check
    - update REPO_STATE
  required_outputs:
    - checkpoint
    - progress_reconciliation
    - issue_projection_disposition
    - next_frontier
    - successor_ep_or_terminal_disposition
