benchmarks: []
scope:
  allowed:
    - path: agents/relay/**
      reason: WP-001 exists to reconcile V2.5 custody, roadmap, issue graph, evidence, quality, checkpoints, and successor state.
    - path: AGENTS.md
      reason: ODR-0001 requires the stale delivery-protocol pointer to be reconciled; only delivery-protocol metadata/wiring may change.
  allowed_reads:
    - path: agents/chains/**
      reason: Legacy V2 artifacts are migration evidence and provenance only.
    - path: docs/emp1/**
      reason: EMP.1 source/authority documents may be read to avoid misclassifying current issue relationships; they are not writable in this EP.
    - path: validation/emp1/**
      reason: Existing benchmark/oracle custody may be read to preserve authority boundaries.
    - domain: GitHub issues #1830 #1834 #1852 #1854 #54 #1768 #1775
      reason: The initial issue graph must reflect verified coordination state.
    - domain: reallaksh19/Common engineering-pr-delivery-v2.5
      reason: Validators, schemas, and migration rules are governed by the pinned protocol basis.
  protected:
    - invariant: Existing engineering calculations, source-qualified methods, applicability, numerical values, benchmarks, oracles, and tolerances remain byte-for-byte outside this EP's write scope.
      reason: Delivery migration cannot create engineering authority.
    - invariant: "#1834 and #1852 remain unresolved Owner decisions unless separate applied ODRs explicitly decide them."
      reason: Migration must not silently answer product/method or result-contract choices.
    - invariant: Legacy agents/chains and workreport artifacts remain unmodified provenance.
      reason: V2 evidence must be preserved rather than rewritten into apparent V2.5 authority.
    - invariant: AGENTS.md project-specific engineering criticality and protected-domain rules are retained.
      reason: Updating the protocol pointer must not weaken stricter project policy.
  prohibited:
    - domain: src/**
      reason: No production or engineering implementation change belongs to the migration WP.
    - domain: validation expected values, oracle payloads, or tolerances
      reason: Migration evidence cannot tune engineering acceptance.
    - domain: .github/workflows/**
      reason: Workflow-file changes require separate explicit authorization.
    - domain: WRC/EMP.1/LAFEA/load-calculation method or source authority
      reason: Protocol migration is not an engineering-method qualification.
    - domain: result semantic hashes, route authorization, code-compliance, professional-release, or deployment authority
      reason: These protected trust contracts require their own authorized engineering work.
  owner_reserved:
    - decision: "#1834 gamma/interpolation product-method disposition"
      reason: The owner has not selected a real-vessel gamma policy.
    - decision: "#1852 authority-bearing resultHash policy"
      reason: Cross-engine semantic identity requires an explicit owner disposition before hash-bearing changes.
    - decision: Merge, professional release, code-compliance, or deployment authorization
      reason: ODR-0001 grants no such authority.
anti_drift:
  do_not:
    - id: ADR-01
      restriction: Do not change any path outside agents/relay/** except the delivery-protocol metadata in AGENTS.md.
      reason: Preserve a surgical migration boundary.
    - id: ADR-02
      restriction: Do not convert issue, benchmark, CAUx, or legacy-chain agreement into engineering-method authority.
      reason: Coordination/evidence projections do not outrank controlled engineering authority.
    - id: ADR-03
      restriction: Do not mark #1834 or #1852 satisfied, declined, or deferred without a separate applied Owner decision.
      reason: Those choices are explicitly reserved.
  stale_if:
    - id: STALE-01
      condition: Common main changes the governing V2.5 protocol basis before material execution.
      effect: RECONCILE
      rationale: The semantic contract must be re-grounded against the live protocol selected by the Owner.
    - id: STALE-02
      condition: Advanced_Analysis main changes any AGENTS.md or agents/relay path from the EP base-observed ref.
      effect: RECONCILE
      rationale: Base drift overlaps the authorized migration write domain.
    - id: STALE-03
      condition: A separate Owner decision resolves #1834 or #1852 before this EP checkpoints.
      effect: OWNER_REVIEW
      rationale: The successor roadmap and issue graph may materially change, although this EP still may not implement those engineering choices.
    - id: STALE-04
      condition: RM-0002 changes WP-001 scope, dependencies, acceptance, or protected invariants.
      effect: STALE
      rationale: The active forward contract would no longer match roadmap authority.
implementation_plan:
  - id: STEP-01
    objective: Populate the initial V2.5 issue graph from re-observed current GitHub state without making issue prose roadmap authority.
    targets:
      - agents/relay/roadmap/ISSUE_GRAPH.yaml
    reads:
      - INPUT-04 issue locators
      - RM-0002 and ODR-0001
    writes:
      - agents/relay/roadmap/ISSUE_GRAPH.yaml
    inputs:
      - INPUT-02
      - INPUT-04
    acceptance:
      - AC-01
    tests:
      - TEST-01
    expected_state: ISSUE_GRAPH records verified issue states and only evidence-supported coordination relationships; roadmap authority remains OVERALL_ROADMAP.
    stop_conditions:
      - Stop and mark a GitHub state UNKNOWN if current external state cannot be re-observed.
      - Stop relationship creation when issue text does not support the proposed parent/dependency/ownership edge.
  - id: STEP-02
    objective: Complete the migration worksheet and propose the next repository roadmap frontier from durable evidence without auto-promoting legacy chains.
    targets:
      - agents/relay/migration/MIGRATION_RECONCILIATION.yaml
      - agents/relay/roadmap/**
    reads:
      - INPUT-03 migration evidence
      - STEP-01 issue graph
    writes:
      - agents/relay/migration/MIGRATION_RECONCILIATION.yaml
      - agents/relay/roadmap/** only through valid V2.5 roadmap transactions
    inputs:
      - INPUT-03
      - INPUT-04
    acceptance:
      - AC-04
    tests:
      - TEST-04
    expected_state: The checkpoint can state an exact next frontier or truthful idle/owner-decision disposition without deriving authority from legacy ACTIVE.md files.
    stop_conditions:
      - Stop before applying any Owner-intent roadmap mutation that lacks an APPLIED ODR.
      - Stop before scheduling engineering work whose current authority, inputs, or acceptance cannot be reconstructed from repository state.
  - id: STEP-03
    objective: Reconcile the project overlay from the legacy Common protocol pointer to the Owner-selected V2.5 protocol while retaining stricter engineering protections.
    targets:
      - AGENTS.md
    reads:
      - INPUT-01 pinned protocol
      - INPUT-02 Owner decision
      - INPUT-05 project overlay
    writes:
      - AGENTS.md delivery-protocol source/reference/minimum-basis and relay-path wording only
    inputs:
      - INPUT-01
      - INPUT-02
      - INPUT-05
    acceptance:
      - AC-02
    tests:
      - TEST-02
    expected_state: AGENTS.md points future delivery at V2.5 and preserves all project criticality, validation truth, protected engineering domains, and merge/release restrictions.
    stop_conditions:
      - Stop if the diff changes a project engineering protection rather than delivery-protocol wiring.
      - Stop if the live Common protocol no longer matches INPUT-01.
  - id: STEP-04
    objective: Execute V2.5 conformance/cold-start checks, record quality evidence, checkpoint WP-001, calculate progress, and publish the exact successor disposition.
    targets:
      - agents/relay/quality/**
      - agents/relay/checkpoints/**
      - agents/relay/roadmap/PROGRESS.yaml
      - agents/relay/REPO_STATE.yaml
      - agents/relay/reports/**
    reads:
      - INPUT-01 protocol validators
      - all WP-001 outputs
    writes:
      - agents/relay/quality/**
      - agents/relay/checkpoints/**
      - agents/relay/roadmap/PROGRESS.yaml
      - agents/relay/REPO_STATE.yaml
      - agents/relay/reports/**
    inputs:
      - INPUT-01
      - INPUT-02
      - INPUT-03
    acceptance:
      - AC-03
      - AC-04
    tests:
      - TEST-03
      - TEST-04
    expected_state: WP-001 ends with truthful validator evidence, a bound QRV/checkpoint, calculated progress, and one exact successor frontier or non-executable disposition.
    stop_conditions:
      - Do not convert unavailable validator execution into PASS.
      - Do not checkpoint with a true blocking quality finding or an unresolved protected-invariant failure.
next_work:
  phase_transition: false
  steps:
    - order: 1
      action: Execute STEP-01 after candidate-specific takeover and live material-write readiness succeed.
      targets:
        - agents/relay/roadmap/ISSUE_GRAPH.yaml
      inputs:
        - INPUT-02
        - INPUT-04
      tests:
        - TEST-01
      benchmarks: []
      acceptance:
        - AC-01
      expected_result: Verified current issue state is represented as coordination projection without altering roadmap or engineering authority.
      stop_if:
        - Current issue state cannot be re-observed.
        - Material-write readiness is false.
    - order: 2
      action: Execute STEP-02 and derive only evidence-supported roadmap proposals/status updates.
      targets:
        - agents/relay/migration/MIGRATION_RECONCILIATION.yaml
        - agents/relay/roadmap/**
      inputs:
        - INPUT-03
        - INPUT-04
      tests:
        - TEST-04
      benchmarks: []
      acceptance:
        - AC-04
      expected_result: Migration reconciliation names the exact next frontier or a truthful non-executable disposition.
      stop_if:
        - A required Owner-intent mutation lacks an APPLIED ODR.
        - Legacy evidence cannot support the proposed current position.
    - order: 3
      action: Execute STEP-03 and change only the stale V2 delivery-protocol pointer in AGENTS.md.
      targets:
        - AGENTS.md
      inputs:
        - INPUT-01
        - INPUT-02
        - INPUT-05
      tests:
        - TEST-02
      benchmarks: []
      acceptance:
        - AC-02
      expected_result: Project overlay routes future material delivery through V2.5 while project engineering protections remain unchanged.
      stop_if:
        - AGENTS.md has overlapping drift.
