    name: V2.5 protocol basis
    description: Pinned Common protocol that defines the relay schemas, validators, readiness gates, and migration rules.
    authority: ODR-0001 and pinned Common repository source
    source: reallaksh19/Common@1f4e9956e89f394fda5e4e730e13ecd8709c8f04/skills/engineering-pr-delivery-v2.5
    value: 1f4e9956e89f394fda5e4e730e13ecd8709c8f04
    type: git commit
    units: NA
    editable: false
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    consumers:
      - STEP-01
      - STEP-03
      - STEP-04
    validation:
      - Re-observe Common main and require the pinned commit unless a roadmap/protocol reconciliation is performed.
    stale_if:
      - The governing V2.5 protocol basis is superseded or Owner intent changes.
  - id: INPUT-02
    name: Applied Owner protocol decision
    description: Durable Owner authority adopting V2.5 without granting engineering or material-write authority.
    authority: OWNER
    source: agents/relay/roadmap/owner-decisions/ODR-0001.yaml
    value: ODR-0001
    type: owner decision record
    units: NA
    editable: false
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    consumers:
      - STEP-01
      - STEP-03
      - STEP-04
    validation:
      - validate_owner_decision.py must accept the record and status must remain APPLIED.
    stale_if:
      - ODR-0001 is superseded or its retained/invalidated behavior changes.
  - id: INPUT-03
    name: Legacy relay inventory and migration worksheet
    description: Repository-wide V2 evidence inventory plus explicit non-promotion reconciliation.
    authority: Repository evidence at the frozen migration basis
    source: agents/relay/migration/V2_INVENTORY.yaml and agents/relay/migration/MIGRATION_RECONCILIATION.yaml
    resolution_method: Read both files and verify their source Git basis and migration rules.
    type: migration evidence set
    units: NA
    editable: true
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    consumers:
      - STEP-01
      - STEP-02
      - STEP-04
    validation:
      - Inventory counts and paths must remain evidence discovery only; no legacy endpoint may be promoted automatically.
    stale_if:
      - Legacy relay inventory changes materially without reconciliation.
      - A new current delivery source is discovered that changes the first frontier.
  - id: INPUT-04
    name: Current coordination issue set
    description: GitHub issue projections used to populate the initial V2.5 issue graph.
    authority: Verified GitHub issue state and issue text, as coordination evidence only
    source: issues #1830 #1834 #1852 #1854 #54 #1768 #1775
    value:
      - 1830
      - 1834
      - 1852
      - 1854
      - 54
      - 1768
      - 1775
