    - order: 4
      action: Execute STEP-04 quality, conformance, checkpoint, progress, and successor reconciliation.
      targets:
        - agents/relay/**
      inputs:
        - INPUT-01
        - INPUT-02
        - INPUT-03
      tests:
        - TEST-03
        - TEST-04
      benchmarks: []
      acceptance:
        - AC-03
        - AC-04
      expected_result: WP-001 has durable evidence and an exact successor disposition; no engineering authority is inferred.
      stop_if:
        - A MUST_PASS conformance check fails.
        - A hard-stop quality or authority condition is active.
qualification_boundary:
  required: false
  trigger: null
  from_phase: null
  to_phase: null
  changed_dimensions: []
  basis:
    - WP-001 changes delivery custody and repository protocol metadata only; it does not cross a production-path, engineering-authority, numerical-method, protected engineering invariant, engineering input-authority, or engineering verification-oracle boundary.
  question_set: null
quality:
  applicable:
    - blueprint: software-design
      reason: WP-001 changes repository state ownership and execution-contract architecture.
      review_focus:
        - authority ownership
        - state-plane separation
        - roadmap/frontier consistency
    - blueprint: testing
      reason: V2.5 conformance, cold-start, and anti-drift behavior require executable verification before checkpoint.
      review_focus:
        - validator coverage
        - NOT_RUN truthfulness
        - acceptance mapping
    - blueprint: migration
      reason: This EP migrates durable delivery custody from legacy V2 artifacts to V2.5 without auto-promoting history.
      review_focus:
        - evidence preservation
        - non-promotion of legacy endpoints
        - progress-basis correctness
    - blueprint: github-delivery
      reason: Current GitHub issues and PR #1858 are coordination projections that must remain consistent with repository truth.
      review_focus:
        - verified issue states
        - projection versus authority separation
        - draft PR custody
  not_applicable:
    - blueprint: coding
      reason: WP-001 changes YAML/Markdown delivery metadata only and does not alter production or protocol implementation code.
    - blueprint: ui-ux
      reason: No product interface or user journey is changed.
    - blueprint: engineering-numerics
      reason: Engineering calculations, algorithms, tolerances, or numerical authority are prohibited from this EP.
    - blueprint: code-review
      reason: The slice does not modify executable application/protocol code; migration and GitHub-delivery quality procedures cover the changed metadata contracts.
    - blueprint: accessibility
      reason: No user interface or accessibility surface is modified.
    - blueprint: performance
      reason: No runtime or performance-sensitive behavior is modified.
  review_contract:
    required: true
    required_before_checkpoint: true
    receipt_namespace: QRV-
    required_outputs:
      - procedure_results
      - findings
      - owner_report
      - successor_handover
  findings_policy: Quality findings remain quality state unless they map to an existing acceptance, authority, protected-invariant, repository-conflict, or safety hard-stop condition.
  ordinary_findings_are_hard_stops: false
acceptance:
  - id: AC-01
    description: Initial ISSUE_GRAPH contains re-observed GitHub state and evidence-supported relationships for the migration-relevant issue set, without treating issues as roadmap or engineering authority.
    weight: 25
    verification:
      - TEST-01
  - id: AC-02
    description: AGENTS.md points to the pinned V2.5 delivery protocol and retains all project-specific engineering criticality/protection rules unchanged in substance.
    weight: 25
    verification:
      - TEST-02
  - id: AC-03
    description: Applicable V2.5 conformance/cold-start checks and quality procedures have truthful bound evidence; required checks are not reported PASS unless executed successfully.
    weight: 25
    verification:
      - TEST-03
  - id: AC-04
    description: WP-001 ends with calculated progress, checkpoint custody, and an exact next frontier or truthful idle/Owner-decision disposition derived from repository state.
    weight: 25
    verification:
      - TEST-04
validation:
  - id: TEST-01
    class: MUST_PASS
    method: Validate ISSUE_GRAPH structure and manually re-open every recorded GitHub locator to confirm github_state and relationship evidence.
    proves:
      - AC-01
  - id: TEST-02
    class: MUST_PASS
    method: Inspect the AGENTS.md diff and verify only V2-to-V2.5 delivery-protocol metadata changed; all protected project rules remain substantively identical.
    proves:
      - AC-02
  - id: TEST-03
    class: MUST_PASS
    method: Execute the pinned Common V2.5 validate_relay_conformance.py, cold_start_check.py, validate_baton_readiness.py, and applicable quality validation on the checkpoint material ref.
    proves:
      - AC-03
  - id: TEST-04
    class: MUST_PASS
    method: Execute roadmap/progress/checkpoint validation and independently recompute the frontier from the resulting OVERALL_ROADMAP before successor publication.
    proves:
      - AC-04
