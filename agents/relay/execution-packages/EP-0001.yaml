      - STEP-01
      - STEP-02
    validation:
      - Re-read every issue before recording github_state or relationship.
    stale_if:
      - Any target issue changes state or materially changes its ownership/dependency statement before STEP-01 completes.
  - id: INPUT-05
    name: Project agent overlay
    description: Project-specific criticality, protected engineering domains, and current legacy Common protocol pointer.
    authority: Repository project policy
    source: AGENTS.md
    resolution_method: Read AGENTS.md at the live material head and preserve all engineering/project protections while changing only delivery-protocol metadata.
    type: repository policy
    units: NA
    editable: true
    applicability: CURRENT_STEP_REQUIRED
    resolution: READY
    consumers:
      - STEP-03
    validation:
      - Diff must show only the protocol source/reference/minimum-basis/path wording needed for V2.5 migration.
    stale_if:
