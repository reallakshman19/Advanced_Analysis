qualification_boundary:
  required: true
  trigger: MATERIAL_QUALIFICATION_BOUNDARY_CHANGE
  from_phase: PH-1711/C3-C
  to_phase: PH-1711/C3-D
  changed_dimensions:
    - ordinary production response and equilibrium authority
    - convergence classification and uncertainty evidence
    - distorted quadratic mapping under production response
    - near-incompressible plane-strain support boundary
  basis:
    - https://github.com/reallaksh19/Advanced_Analysis/issues/1771
    - agents/relay/roadmap/OVERALL_ROADMAP.yaml@RM-0007
  question_set: null
quality:
  applicable:
    - blueprint: coding
      reason: C3-D may add qualification orchestration and conditionally repair an executed production defect.
      review_focus:
        - minimal owning boundary
        - failure semantics
        - no benchmark-specific production branching
    - blueprint: testing
      reason: C3-D acceptance is dominated by executable ordinary-route benchmark and negative evidence.
      review_focus:
        - B02/BM-005 coverage
        - deterministic replay
        - negative/fail-closed behavior
    - blueprint: engineering-numerics
      reason: C3-D qualifies continuum response, equilibrium, convergence, distorted mapping and near-incompressible behavior.
      review_focus:
        - force and moment equilibrium
        - final residual
        - energy consistency
        - mesh-order/Richardson/GCI validity
        - locking and Jacobian envelopes
    - blueprint: code-review
      reason: Numerical and qualification changes require independent review against frozen authority.
      review_focus:
        - anti-circularity
        - source custody
        - first-wrong-boundary isolation
    - blueprint: github-delivery
      reason: Exact-head execution and artifacts are required for issue closure.
      review_focus:
        - exact-head custody
        - PASS/FAIL/NOT_RUN truth
        - issue/PR correlation
  not_applicable:
    - blueprint: software-design
      reason: This draft assumes no architecture/state-owner redesign; reclassify if fresh qualification proves one is required.
    - blueprint: ui-ux
      reason: C3-D owns numerical production-route qualification, not the workbench presentation design.
    - blueprint: accessibility
      reason: No accessibility surface is in C3-D scope.
    - blueprint: performance
      reason: Runtime performance is not a C3-D acceptance criterion unless a demonstrated solver robustness defect explicitly requires it.
    - blueprint: migration
      reason: No persisted schema/data migration is planned.
  review_contract:
    required: true
    required_before_checkpoint: true
    receipt_namespace: QRV-
    required_outputs:
      - procedure_results
      - findings
      - owner_report
      - successor_handover
  findings_policy: Quality findings remain quality state unless they map to an existing acceptance, authority, protected-invariant, or safety hard-stop condition.
  ordinary_findings_are_hard_stops: false
