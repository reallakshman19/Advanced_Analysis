benchmarks:
  - id: BENCH-C3D-B02
    name: B02 production response sequence
    purpose: Exercise B02A bending, B02B shear, B02C Kirsch/hole, B02D lug/pinhole and B02E convergence policy through existing production qualification surfaces.
    source: scripts/lafea-b02-production-sequence-check.mjs
    oracle_class: REFERENCE_DATA
    payload: Existing frozen B02 definitions and their production sequence; production output may not redefine expected values or tolerances.
    expected: Constituent checks emit PASS and the sequence emits the B02E production qualification receipt without granting release authority.
    tolerance: Existing frozen B02 tolerances only.
    independence: Frozen definitions/oracles predate current C3-D observation and individual cases include analytical or independently reconstructed references.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3D-1
      - AC-C3D-2
      - AC-C3D-5
    stale_if:
      - B02 frozen definitions, production sequence, oracle authority or tolerances change.
  - id: BENCH-C3D-BM005
    name: BM-005 ordinary-route Lamé audit
    purpose: Prove source/domain to mesh, solve/recovery, fixed-probe convergence and report custody on one ordinary production case.
    source: scripts/lafea.3-bm005-ordinary-route-check.mjs
    oracle_class: ANALYTICAL
    payload: Frozen BM-005 Lamé thick-cylinder definition, independent source registry, four-level mesh ladder and report contract.
    expected: Exact candidate head and clean-tree evidence with PASS route/probe/convergence report and releaseQualified false.
    tolerance: Frozen BM-005 report/benchmark tolerances only.
    independence: Lamé oracle is source-controlled independently of production output and report custody rejects stale or self-selected evidence.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3D-1
      - AC-C3D-2
      - AC-C3D-5
      - AC-C3D-6
    stale_if:
      - BM-005 benchmark, source registry, report contract or route implementation changes.
  - id: BENCH-C3D-MAPPING
    name: Distorted T6/Q8 mapping baseline
    purpose: Preserve existing high-order mapping, affine consistency and non-positive-Jacobian fail-closed evidence while C3-D exercises production response.
    source: scripts/lafea-b01-final-qualification.mjs
    oracle_class: MANUAL_RECONSTRUCTION
    payload: Existing B01 T6/Q8 distorted/affine mapping and Jacobian qualification; C3-D must consume rather than weaken it.
    expected: Current high-order mapping qualification remains passing on an executed basis and invalid mappings remain rejected before accepted response.
    tolerance: Existing B01 qualification tolerances only.
    independence: Mapping expectations are derived from element geometry/interpolation identities independently of B02 production outputs.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3D-3
    stale_if:
      - T6/Q8 formulation, integration rule, Jacobian gate or B01 mapping fixtures change.
  - id: BENCH-C3D-BBAR
    name: Near-incompressible plane-strain B-bar qualification
    purpose: Bound the supported near-incompressible plane-strain regime without silently accepting locking-prone displacement-only behavior.
    source: scripts/lafea-plane-strain-bbar-lame-check.mjs
    oracle_class: ANALYTICAL
    payload: Frozen plane-strain B-bar Lamé definition, nu ladder, T6/Q8 mesh ladders, distortion matrix and fixed probes.
    expected: Qualified B-bar cases satisfy their frozen error/convergence envelope and unsupported formulation/load combinations fail closed.
    tolerance: Frozen plane-strain B-bar qualification tolerances only.
    independence: Analytical Lamé reference and frozen nu/mesh/probe definitions are not selected from candidate output.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3D-4
    stale_if:
      - B-bar formulation, nu envelope, benchmark definition, mesh ladder, oracle or tolerance changes.
scope:
  allowed:
    - path: scripts/lafea.3-c3d-*
      reason: C3-D-only orchestration/qualification may be added if fresh qualification proves existing composition insufficient.
    - path: agents/relay
      reason: V2.5 qualification, takeover, progress, quality, checkpoint and successor custody.
    - path: agents/chains/ADV-LAFEA3-C3D-1771
      reason: C3-D-specific source/evidence custody if needed.
  allowed_reads:
    - path: scripts/lafea-b02*
      reason: Reuse B02 production response and convergence surfaces.
    - path: scripts/lafea.3-bm005-*
      reason: Reuse ordinary-route Lamé audit and report contract.
    - path: scripts/lafea-b01*
      reason: Reuse high-order mapping/element baseline rather than duplicate it.
    - path: scripts/lafea-plane-strain-bbar-*
      reason: Reuse near-incompressible plane-strain qualification.
    - path: src/core/local-continuum
      reason: Trace first wrong numerical owner only after a real executed failure.
    - path: src/workspace
      reason: Trace ordinary-route/currentness/custody behavior.
  protected:
    - invariant: Existing frozen B02, BM-005, B01 and B-bar oracles/tolerances remain independent of observed C3-D output.
      reason: Prevent benchmark fitting.
    - invariant: T6/Q8 production element policy and current Jacobian fail-closed rules remain unchanged unless a fresh qualified failure proves the owning implementation is wrong.
      reason: C3-D is production response qualification, not permission to weaken element mechanics.
    - invariant: Authoritative stress/recovery semantics remain owned by C3-E; C3-D may consume fixed declared quantities but may not promote display smoothing to authority.
      reason: Preserve #1773 scope boundary.
  prohibited:
    - domain: tolerance or oracle relaxation
      reason: Cannot obtain qualification by moving acceptance.
    - domain: display-only smoothing/projection as numerical authority
      reason: Owned by C3-E and explicitly prohibited by #1771/#1773.
    - domain: release/registry claim promotion
      reason: Owned by C3-G.
    - domain: unrelated LAFEA.4+, EMP.1, piping or non-FEA work
      reason: Preserve one-WP scope.
  owner_reserved:
    - decision: Promote this DRAFT EP to executable before WP-1769 is reconciled.
      reason: Would violate the serial dependency frontier.
    - decision: Add or change GitHub workflow YAML for C3-D.
      reason: Repository AGENTS policy requires explicit workflow-file authorization at the time of material execution.
anti_drift:
  do_not:
    - id: ADR-C3D-1
      restriction: Do not write production mechanics before fresh C3-D qualification and a real executed failure identify the first wrong owner.
      reason: Existing qualification estate may already satisfy the issue once composed and executed.
    - id: ADR-C3D-2
      restriction: Do not substitute kernel-only PASS, historical PASS or zero-step workflow outcomes for current production-route execution.
      reason: C3-D requires actual ordinary-route response/convergence evidence.
    - id: ADR-C3D-3
      restriction: Do not change B02/BM-005/B01/B-bar expected values or tolerances based on observed production results.
      reason: Preserve anti-circularity.
  stale_if:
    - id: STALE-C3D-1
      condition: WP-1769 disposition or RM-0007 dependencies change before activation.
      effect: RECONCILE
      rationale: Successor routing basis changed.
    - id: STALE-C3D-2
      condition: Main changes a C3-D constituent script, benchmark/oracle definition, local-continuum numerical implementation or workbench route before activation.
      effect: RECONCILE
      rationale: Draft source inventory and material basis are no longer current.
