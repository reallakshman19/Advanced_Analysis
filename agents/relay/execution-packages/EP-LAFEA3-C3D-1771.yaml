    verification:
      - TEST-C3D-BBAR
      - BENCH-C3D-BBAR
  - id: AC-C3D-5
    description: Convergence uses at least three executed retained levels sorted by realized h, fixed physical quantities and reconstructible order/Richardson/GCI classification only where assumptions apply.
    weight: 15
    verification:
      - TEST-C3D-B02
      - TEST-C3D-BM005
  - id: AC-C3D-6
    description: Exact-head evidence preserves source/geometry/mesh/model/solver/result custody and distinguishes current execution from historical or zero-step evidence.
    weight: 10
    verification:
      - TEST-C3D-BM005
      - TEST-C3D-DIFF
  - id: AC-C3D-7
