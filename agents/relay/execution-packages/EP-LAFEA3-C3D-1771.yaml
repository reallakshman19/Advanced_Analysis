    authority: GitHub issue #1771 under #1711
    source: https://github.com/reallaksh19/Advanced_Analysis/issues/1771
    resolution_method: Read the current issue body and reconcile any changed acceptance before activation.
    type: issue contract
    units: NA
    editable: false
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    consumers:
      - STEP-C3D-BASELINE
      - STEP-C3D-DISPOSITION
    validation:
      - Issue remains open and its predecessor/dependency declarations still match RM-0007.
    stale_if:
