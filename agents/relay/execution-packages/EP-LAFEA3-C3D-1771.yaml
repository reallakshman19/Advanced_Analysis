    description: B02A-B02E and at least one BM-005 ordinary-route case execute through retained source/domain/mesh/model/currentness ancestry rather than benchmark-only preassembled arrays.
    weight: 20
    verification:
      - TEST-C3D-B02
      - TEST-C3D-BM005
      - BENCH-C3D-B02
      - BENCH-C3D-BM005
  - id: AC-C3D-2
    description: Accepted production-route cases retain final solver residual, force and moment equilibrium, energy evidence and deterministic replay without tolerance relaxation.
    weight: 15
    verification:
      - TEST-C3D-B02
      - TEST-C3D-BM005
  - id: AC-C3D-3
    description: Distorted but valid T6/Q8 mapping remains qualified and non-positive or unsupported mapping fails closed before accepted response.
    weight: 15
    verification:
      - TEST-C3D-B01
      - BENCH-C3D-MAPPING
  - id: AC-C3D-4
    description: The declared near-incompressible plane-strain envelope is either explicitly qualified through B-bar or rejected fail-closed; ordinary displacement-only behavior is not overclaimed.
