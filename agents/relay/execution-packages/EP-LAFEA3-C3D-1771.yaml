  engineering:
    - Reuse the existing B02, BM-005, B01 high-order and B-bar evidence surfaces; add orchestration or production repair only at a demonstrated missing or failing boundary.
context_capsule:
  product_goal: Complete the LAFEA.3 architecture path with production-route numerical response evidence rather than kernel-only evidence.
  roadmap_position: OBJ-1710 / PH-1711 / planned WP-1771 after unresolved WP-1769.
  why_this_work_exists: Issue #1771 requires B02 response, equilibrium, distorted quadratic mapping, near-incompressible plane-strain and convergence evidence on the ordinary production route.
  current_architecture: The repository already has the B02 production sequence, BM-005 ordinary-route workbench harness, B01 high-order element qualification and a separately bounded plane-strain B-bar route.
  prior_owner_decisions:
    - ODR-0001
  current_implementation_state: Existing scripts cover most requested C3-D mechanics and benchmark cases, but no current exact-head C3-D composition execution has been retained and C3-C predecessor acceptance remains NOT_RUN / INFRASTRUCTURE.
  known_problems:
    - WP-1769 / issue #1769 is still unresolved because C3-C.6 and the current 19-step aggregate have not executed.
    - Hosted GitHub Actions jobs continue to receive runner_id 0 and execute zero steps.
    - No dedicated C3-D aggregate/workflow has been established as current authority; existing constituent checks must first be reconciled by fresh qualification.
  deliberate_non_goals:
    - No tolerance relaxation, oracle fitting, solver formulation change, mesh-quality relaxation, stress-smoothing promotion, or release-authority change.
    - Do not duplicate already-qualified B01 element mechanics merely to satisfy C3-D.
  terminology:
    ordinary_route: Source/domain intent through retained mesh, canonical model, governed solve/recovery, fixed physical probes and convergence/result custody.
    no_patch: Existing production and qualification surfaces are sufficient once composed/executed; no mechanics mutation is justified.
repository_discovery:
  - id: DSTEP-C3D-ROUTE
    action: VERIFY
    target: agents/relay/REPO_STATE.yaml
    question: Is WP-1771 actually on the computed serial frontier after WP-1769 completes, with this EP promoted from DRAFT only after predecessor reconciliation?
    expected_outputs:
      - current roadmap revision
      - computed frontier
      - predecessor WP-1769 disposition
      - active execution package
    receipt_required: true
    on_failure: Keep EP-LAFEA3-C3D-1771 non-executable and reconcile predecessor/roadmap custody.
  - id: DSTEP-C3D-EXISTING-EVIDENCE
    action: INSPECT
    targets:
      - scripts/lafea-b02-production-sequence-check.mjs
      - scripts/lafea.3-bm005-ordinary-route-check.mjs
      - scripts/lafea-b01-final-qualification.mjs
      - scripts/lafea-plane-strain-bbar-lame-check.mjs
    question: Which #1771 acceptance obligations are already represented by existing production-route or independent qualification surfaces, and where is a composition gap still real?
    expected_outputs:
      - B02A-B02E coverage map
      - BM-005 route/custody map
      - distorted T6/Q8 evidence map
      - near-incompressible plane-strain evidence map
      - explicit NO_PATCH or first missing composition boundary
    receipt_required: true
    on_failure: Do not create a new aggregate or modify mechanics until the missing surface is identified exactly.
  - id: DSTEP-C3D-GIT
    action: VERIFY_GIT
    target: live checkout
    question: Does the activation candidate match the declared main/material basis with no qualification-relevant drift?
    expected_outputs:
      - branch
      - exact HEAD
      - main/base SHA
      - relevant changed-file set
      - clean-tree state
    receipt_required: true
    on_failure: Drop material WRITE authority and reconcile the candidate before execution.
