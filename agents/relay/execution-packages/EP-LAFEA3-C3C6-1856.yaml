benchmarks:
  - id: BENCH-C3C6-MATRIX-CONTRACT
    name: Seven-class invalidation contract
    purpose: Independently define the expected invalidation/non-invalidation behavior before observing runtime results.
    source: agents/relay/execution-packages/EP-LAFEA3-C3C6-1856.yaml
    oracle_class: MANUAL_RECONSTRUCTION
    payload: "Seven classes: GEOMETRY, MATERIAL, LOAD, SUPPORT, MESH_PROFILE, SOLVER_CONFIGURATION, PROBE; reachable governed edits must exercise store currentness, unsupported editable surfaces must be explicit non-claims, and edit-after-solve/edit-during-run must not preserve false CURRENT_RESULT authority."
    expected: Governed ancestor edits revoke dependent current authority; legitimate non-descendants remain current; unsupported surfaces are explicit non-claims; edit during RUNNING yields no old current result.
    tolerance: null
    independence: The expected state transitions are frozen in the EP acceptance contract and may not be changed based on observed candidate results.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3C6-1
      - AC-C3C6-2
      - AC-C3C6-3
      - AC-C3C6-4
      - AC-C3C6-5
    stale_if:
      - Owner or governing currentness contract changes the accepted edit classes or lineage semantics.
  - id: BENCH-C3C6-AGGREGATE
    name: Exact-head C3-C aggregate
    purpose: Verify the new matrix step does not regress the complete C3-C qualification suite.
    source: scripts/lafea.3-c3c-model-compiler-qualification-check.mjs
    oracle_class: OBSERVATIONAL
    payload: 19 declared C3-C steps with source-custody verification and exact-head check.
    expected: Aggregate process exits 0 and every declared step reports PASS on the current exact head.
    tolerance: null
    independence: The aggregate includes previously established C3-C checks and source custody outside the new matrix assertions.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-C3C6-6
      - AC-C3C6-7
    stale_if:
      - Aggregate step list, source basis, or exact candidate head changes.
