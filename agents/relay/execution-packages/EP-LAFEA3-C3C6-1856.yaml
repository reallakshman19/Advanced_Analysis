      stop_if:
        - Exact head/base drifts before execution.
        - The execution environment cannot run the commands; preserve NOT_RUN with cause INFRASTRUCTURE.
      execution_requirement:
        id: EXECREQ-C3C6-EXACT-HEAD
        type: EXTERNAL_ENVIRONMENT
        actor: GitHub Actions runner or equivalent exact-checkout Node 22 environment
        environment:
          kind: Linux Node 22
          description: Full repository checkout with Git history and npm dependencies available.
        command: "node scripts/lafea.3-c3c-edit-invalidation-matrix-check.mjs && node scripts/lafea.3-c3c-model-compiler-qualification-check.mjs --expected-head $(git rev-parse HEAD)"
        instruction: null
        working_directory: repository root
        required_basis:
          - current PR #1857 exact head
          - base PR #1850 exact head
          - C3C-SOURCE-BASIS-0016
        unavailable_here_reason: Connected GitHub Actions attempts received runner_id 0 with zero steps, and the local container cannot clone github.com.
        expected_evidence:
          - TEST-C3C6-MATRIX
          - TEST-C3C6-AGGREGATE
        blocks:
          - AC-C3C6-1
          - AC-C3C6-2
          - AC-C3C6-3
          - AC-C3C6-4
          - AC-C3C6-5
          - AC-C3C6-7
        success_condition: Both commands actually execute on the exact current head and retain truthful exit/result evidence.
        clears:
          - C3-C.6 dynamic NOT_RUN
          - C3-C aggregate dynamic NOT_RUN
    - order: 2
      action: If exact-head evidence passes, perform applicable quality review, checkpoint #1856 acceptance, and reconcile progress/issues before considering #1769 closure.
      targets:
        - agents/relay/quality
        - agents/relay/checkpoints
        - agents/relay/roadmap/PROGRESS.yaml
        - agents/relay/roadmap/ISSUE_GRAPH.yaml
      inputs:
        - INPUT-ODR-0001
      tests:
        - TEST-C3C6-DIFF
      benchmarks:
        - BENCH-C3C6-MATRIX-CONTRACT
      acceptance:
        - AC-C3C6-6
        - AC-C3C6-7
      expected_result: A backward-looking exact-basis checkpoint records PASS/FAIL/NOT_RUN truth and computes the next frontier.
      stop_if:
        - Dynamic evidence remains NOT_RUN or FAIL.
        - Quality review finds a protected-invariant or unsafe-engineering condition.
qualification_boundary:
  required: false
quality:
  applicable:
    - blueprint: coding
      reason: The qualification script and workflow are executable repository code.
      review_focus:
        - maintainability and accidental production coupling
    - blueprint: testing
      reason: Issue closure depends on executable assertions and retained receipts.
      review_focus:
        - positive/negative invalidation coverage and ordering cases
    - blueprint: engineering-numerics
      reason: The matrix verifies finite-element workbench currentness around solved engineering state.
      review_focus:
        - ancestry/currentness invariants without numerical-method changes
    - blueprint: code-review
      reason: The candidate changes qualification/custody code that can create misleading evidence if incorrect.
      review_focus:
        - source-custody accuracy and fail-closed behavior
    - blueprint: github-delivery
      reason: PR #1857 and its exact-head workflow are the delivery/evidence vehicle.
      review_focus:
        - exact-head checks, artifact truth, review state, and issue correlation
  not_applicable:
    - blueprint: software-design
      reason: No production architecture or state-owner design is changed by this proof slice.
    - blueprint: ui-ux
      reason: No user-interface behavior is changed.
    - blueprint: accessibility
      reason: No accessibility surface is changed.
    - blueprint: performance
      reason: Performance characteristics are not an acceptance dimension for this bounded qualification.
    - blueprint: migration
      reason: No data/schema migration is performed.
  review_contract:
    required: true
    required_before_checkpoint: true
    receipt_namespace: QRV-
    required_outputs:
      - procedure_results
      - findings
      - owner_report
      - successor_handover
  findings_policy: Ordinary quality findings remain quality state unless they map to an existing true hard-stop category.
  ordinary_findings_are_hard_stops: false
