    description: All seven edit classes are represented; every currently governed editable surface is exercised through the real store and unsupported surfaces are not silently skipped.
    weight: 20
    verification:
      - TEST-C3C6-MATRIX
      - BENCH-C3C6-MATRIX-CONTRACT
  - id: AC-C3C6-2
    description: Each represented class proves both required invalidation and legitimate non-invalidation.
    weight: 15
    verification:
      - TEST-C3C6-MATRIX
      - BENCH-C3C6-MATRIX-CONTRACT
  - id: AC-C3C6-3
    description: No ancestor edit leaves a dependent prior result presenting as CURRENT_RESULT.
    weight: 15
    verification:
      - TEST-C3C6-MATRIX
  - id: AC-C3C6-4
    description: Edit after successful solve and edit during RUNNING ordering cases are explicitly exercised.
    weight: 15
    verification:
      - TEST-C3C6-MATRIX
  - id: AC-C3C6-5
    description: Unreachable governed edit classes are retained as explicit fail-closed non-claims.
    weight: 10
    verification:
      - TEST-C3C6-MATRIX
  - id: AC-C3C6-6
    description: The matrix check is wired into the C3-C aggregate and pinned in the C3-C source basis.
    weight: 10
    verification:
      - TEST-C3C6-DIFF
  - id: AC-C3C6-7
    description: The complete C3-C aggregate remains green with the new matrix step included.
    weight: 15
    verification:
      - TEST-C3C6-AGGREGATE
      - BENCH-C3C6-AGGREGATE
