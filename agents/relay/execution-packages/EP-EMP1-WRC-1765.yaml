    - The pinned WRC PDF is present at Git blob ce861233928154145a9257efbbf8dbef3f5a17d1 with raw SHA-256 698fcdc3e676e3bc6bbf710bc28ea8b666ac9511a81a0067a5d01088ae4c27b2, but connector binary transport does not expose its bytes.
    - The only retained Poppler source-render artifact identified in repository evidence, artifact 9402093459, expired on 2026-09-19 and cannot be downloaded.
    - Current GitHub Actions reruns continue to fail before step creation, so the historical source-render workflow cannot presently regenerate the artifact.
