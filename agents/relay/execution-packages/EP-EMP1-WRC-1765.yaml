benchmarks:
  - id: BENCH-WRC02-GEOMETRY
    name: Bounded geometry semantic reconstruction
    purpose: Prove Rm=100 mm, T=20 mm, r0=17.714285714285715 mm, beta=0.155 and gamma=5 reconstruct only from qualified profile inputs and transformations.
    source: issue #1765 BM-SOURCE-01
    oracle_class: MANUAL_RECONSTRUCTION
    payload: Frozen bounded geometry case from #1765.
    expected: Qualified fields reconstruct exactly; unqualified nominal/corroded/measured/local policy variants remain blocked rather than silently mapped.
    tolerance: exact semantic mapping; numerical arithmetic within existing floating-point policy only
    independence: Expected geometry semantics are defined by source records and issue contract, not candidate production output.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-WRC02-1
      - AC-WRC02-2
  - id: BENCH-WRC02-SIGNS
    name: Source-qualified sign and same-location reconstruction
    purpose: Preserve signed P/Vc/Vl/Mc/Ml/Mt and Au..Dl common-point semantics.
    source: issue #1765 BM-SOURCE-02 through BM-SOURCE-05
    oracle_class: MANUAL_RECONSTRUCTION
    payload: Isolated load polarity, zero-load collapse, common-location superposition and independent stress-intensity reconstruction.
    expected: Only source-qualified sign/location operations may be asserted; unresolved physical surface/common-point claims remain blocked.
    tolerance: Existing frozen numerical tolerance only where arithmetic is exercised.
    independence: Production output cannot define sign or recovery authority.
    applicability: CURRENT_EP_REQUIRED
    resolution: PARTIAL_SOURCE_AUTHORITY
    verifies:
      - AC-WRC02-3
      - AC-WRC02-4
  - id: BENCH-WRC02-SCOPE
    name: Result-scope falsifier
    purpose: Prevent valid host-shell WRC results from being relabeled as nozzle/weld/global/code-compliant outputs.
    source: issue #1765 BM-SOURCE-07
    oracle_class: CONTRACT
    payload: NOZZLE_WALL_STRESS, WELD_STRESS, WRC297_RESULT, CODE_COMPLIANT, GLOBAL_ABSOLUTE_MAXIMUM relabel attempts.
    expected: Each unauthorized claim is rejected or explicitly classified outside authority.
    tolerance: null
    independence: Scope boundary is source/contract authority, not candidate numerical agreement.
    applicability: CURRENT_EP_REQUIRED
    resolution: READY
    verifies:
      - AC-WRC02-5
scope:
  allowed:
    - path: validation/emp1/wrc537-2013/**
      reason: Reconcile source semantics and add a bounded profile only from retained or newly direct-observed source authority.
    - path: validation/emp1/release/**
      reason: Update the aggregate P0 source-semantics projection only when its underlying rows genuinely change.
    - path: docs/emp1/**
      reason: Retain source locators/profile documentation without rewriting the controlled PDF.
    - path: scripts/emp1-wrc537-*
      reason: Add/repair source-semantics consistency and falsifier checks only.
    - path: scripts/emp1-professional-p0-source-semantics-check.mjs
      reason: Reconcile aggregate readiness logic only after genuine row closure.
    - path: agents/relay/**
      reason: V2.5 qualification, takeover, progress, quality, checkpoint and delivery custody.
  allowed_reads:
    - path: src/core/emp1/**
      reason: Verify current route consumes the same bounded semantics without changing mechanics.
  protected:
    - invariant: WRC equations, curve/coefficient data, expected stresses, benchmark/oracle values and tolerances remain unchanged.
      reason: #1765 is semantic source integration, not numerical requalification.
    - invariant: Gamma=5 exact-row, beta 0.05..0.50, dP=0, Kn=Kb=1 and host-shell-only route boundaries remain unchanged.
      reason: Wider capability belongs to separate qualification/Owner decisions.
    - invariant: Code compliance remains NOT_ASSESSED and professional release remains false.
      reason: Source semantics closure is not downstream code or release authorization.
  prohibited:
    - domain: .github/workflows/**
      reason: Workflow mutation is not authorized by this future EP.
    - domain: non-tabulated-gamma interpolation authority
      reason: Owner decision #1834 remains pending.
    - domain: resultHash authority
      reason: Owner decision #1852 remains pending.
    - domain: expected-value/tolerance modification
      reason: Cannot close source semantics by fitting numerical evidence.
  owner_reserved:
    - decision: Any engineering-policy assumption used to replace absent WRC primary-source authority.
      reason: #1765 requires source authority or explicit policy; the candidate may not invent one.
implementation_plan:
  - id: STEP-WRC02-RECONCILE
    objective: Build an exact field-by-field ledger from the ten closed focused issues and classify each #1765 requirement as qualified, outside bounded profile, or still blocked.
    targets:
      - validation/emp1/wrc537-2013/**
      - validation/emp1/release/emp1-wrc537-gamma5-p0-source-semantics-gate-v1.json
    reads:
      - INPUT-WRC02-SOURCE
      - INPUT-WRC02-FOCUSED
    writes:
      - agents/relay/**
      - bounded reconciliation artifact under validation/emp1/wrc537-2013 only after activation
    inputs:
      - INPUT-WRC02-SOURCE
      - INPUT-WRC02-FOCUSED
    acceptance:
      - AC-WRC02-1
      - AC-WRC02-2
      - AC-WRC02-3
      - AC-WRC02-4
      - AC-WRC02-5
    tests:
      - TEST-WRC02-LEDGER
    expected_state: Every required semantic field has one explicit authority state and exact durable basis; no BLOCKED row is promoted from secondary/OCR/production evidence.
    stop_conditions:
      - Stop on any contradiction between retained focused records and the pinned source.
      - Stop if closure would require an unrecorded engineering policy.
  - id: STEP-WRC02-PROFILE
    objective: If and only if sufficient direct source authority exists, create the immutable bounded source-semantics profile and reconcile the aggregate gate/checker.
    targets:
      - validation/emp1/wrc537-2013
      - validation/emp1/release/emp1-wrc537-gamma5-p0-source-semantics-gate-v1.json
      - scripts/emp1-professional-p0-source-semantics-check.mjs
    reads:
      - STEP-WRC02-RECONCILE evidence
    writes:
      - bounded source profile
      - aggregate projection/checker
      - documentation and relay custody
    inputs:
      - INPUT-WRC02-SOURCE
      - INPUT-WRC02-FOCUSED
    acceptance:
      - AC-WRC02-6
      - AC-WRC02-7
    tests:
      - TEST-WRC02-PROFILE
      - TEST-WRC02-FALSIFIERS
    expected_state: Professional P0 source semantics is either genuinely READY for the bounded profile or remains explicitly BLOCKED with exact unresolved fields.
    stop_conditions:
      - Do not promote a field without pinned-source or explicitly authorized policy basis.
