context_capsule:
  product_goal: Close WRC-02 source semantics before WRC-03 exact-head numerical qualification.
  roadmap_position: FUTURE OBJ-1760 / PH-WRC-P0 / WP-1765 under RM-0008; current serial frontier remains WP-1769.
  why_this_work_exists: Issue #1765 requires one bounded source-semantics integration profile over the already-closed focused source issues before professional numerical/release claims can advance.
  current_architecture: The bounded route is WRC 537 (2013), cylindrical, round, Original, gamma=5 exact row, beta 0.05..0.50, dP=0, Kn=Kb=1, Au..Dl host-shell recovery only.
  prior_owner_decisions:
    - ODR-0002
  current_implementation_state: Focused issues #1361/#1368/#1370/#1373/#1375/#1377/#1379/#1381/#1383/#1385 are closed, but the aggregate P0 source-semantics gate still reports nine blocked rows and direct pinned-PDF page observation is unavailable in the current connector/runtime.
