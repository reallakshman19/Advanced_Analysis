name: EMP.1 UI remediation qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-emp1-ui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'fix/emp1-complete-sample-lifecycle' ||
      github.head_ref == 'fix/issue-1743-state-contract' ||
      github.head_ref == 'fix/issue-1743-ui-remediation' ||
      github.head_ref == 'fix/issue-1743-pressure-radius-validation' ||
      github.head_ref == 'fix/issue-1748-review-outcome-first' ||
      github.head_ref == 'fix/issue-1749-local-check-simplification' ||
      github.head_ref == 'fix/issue-1750-stale-copy' ||
      github.head_ref == 'chore/issue-1743-walkthrough-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static EMP.1 presentation checks
        run: |
          node --check src/workspace/emp1-assessment-state.js
          node --check src/workspace/emp1-presentation-finalizer.js
          node --check src/workspace/lafea-workbench-dom.js
          node --check src/workspace/lafea-workbench-view.js
          node --check src/workspace/lafea-workbench-controller.js
          node --check src/workspace/lafea-analytical-calc-content.js
          node --check src/workspace/lafea-1-pressure-radius-validation.js
          node scripts/emp1-assessment-state-check.mjs
          node scripts/emp1-qualification-sample-orchestration-check.mjs
          node scripts/emp1-plain-language-labels-check.mjs
          node scripts/emp1-professional-workflow-check.mjs
          node scripts/emp1-readiness-projection-check.mjs
          node scripts/emp1-engineering-review-ui-check.mjs
          node scripts/emp1-issue1743-nonzero-dp-workbench-check.mjs
          node scripts/emp1-issue1743-pressure-radius-validation-check.mjs
          node scripts/emp1-issue1651-acceptance-check.mjs
          npm run check:imports
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused EMP.1 browser qualification
        env:
          DEBUG: pw:webserver
        run: >-
          npx playwright test
          --config=playwright.lafea-visible.config.js
          --project=chromium
          --reporter=line
          e2e/emp1-issue1743-ui-remediation.spec.js
          e2e/emp1-qualification-sample-orchestration.spec.js
          e2e/emp1-professional-workflow.spec.js
          e2e/emp1-presentation-coherence.spec.js
          e2e/emp1-analytical-layout.spec.js
          e2e/emp1-benchmark-evidence.spec.js
          e2e/emp1-human-presentation-tokens.spec.js
          e2e/emp1-professional-release.spec.js
          e2e/emp1-professional-walkthrough-evidence.spec.js

  retain-issue1743-evidence:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'chore/issue-1743-walkthrough-evidence' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: qualify-emp1-ui
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture EMP.1 walkthrough evidence
        env:
          DEBUG: pw:webserver
        run: >-
          npx playwright test
          --config=playwright.lafea-visible.config.js
          --project=chromium
          --reporter=line
          e2e/emp1-professional-walkthrough-evidence.spec.js
      - name: Verify retained evidence package
        run: |
          set -euo pipefail
          test -d artifacts/emp1-walkthrough
          count="$(find artifacts/emp1-walkthrough -type f | wc -l | tr -d ' ')"
          test "$count" = "37"
          test "$(find artifacts/emp1-walkthrough -type f -name '*.png' | wc -l | tr -d ' ')" = "24"
          test "$(find artifacts/emp1-walkthrough -type f -name '*-aria.txt' | wc -l | tr -d ' ')" = "12"
          test -f artifacts/emp1-walkthrough/walkthrough-manifest.json
      - name: Publish evidence branch
        env:
          EVIDENCE_BRANCH: evidence/issue-1743-walkthrough
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a artifacts/emp1-walkthrough/. "$temp_dir/"
          git fetch origin "$EVIDENCE_BRANCH"
          git checkout -B "$EVIDENCE_BRANCH" "origin/$EVIDENCE_BRANCH"
          rm -rf evidence/issue-1743/walkthrough
          mkdir -p evidence/issue-1743/walkthrough
          cp -a "$temp_dir/." evidence/issue-1743/walkthrough/
          cat > evidence/issue-1743/walkthrough/README.md <<EOF
          # EMP.1 Issue 1743 walkthrough evidence

          Generated by the focused professional walkthrough on source commit \`$SOURCE_SHA\`.

          GitHub Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID

          Contents: 12 viewport screenshots, 12 full-page screenshots, 12 ARIA snapshots, and the walkthrough manifest. The manifest requires qualified human observation before final visual acceptance; these files are retained review evidence, not an automated human sign-off.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/issue-1743/walkthrough
          if git diff --cached --quiet; then
            echo "Evidence branch already contains this package."
            exit 0
          fi
          git commit -m "evidence(emp1): retain issue 1743 walkthrough $SOURCE_SHA"
          git push origin "HEAD:$EVIDENCE_BRANCH"
