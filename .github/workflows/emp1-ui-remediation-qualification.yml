name: EMP.1 UI remediation qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-emp1-ui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'fix/emp1-complete-sample-lifecycle' ||
      github.head_ref == 'fix/issue-1743-state-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static EMP.1 presentation checks
        run: |
          node --check src/workspace/emp1-assessment-state.js
          node --check src/workspace/emp1-presentation-finalizer.js
          node --check src/workspace/lafea-workbench-view.js
          node --check src/workspace/lafea-workbench-controller.js
          node --check src/workspace/lafea-analytical-calc-content.js
          node scripts/emp1-assessment-state-check.mjs
          node scripts/emp1-qualification-sample-orchestration-check.mjs
          node scripts/emp1-plain-language-labels-check.mjs
          node scripts/emp1-professional-workflow-check.mjs
          node scripts/emp1-readiness-projection-check.mjs
          node scripts/emp1-engineering-review-ui-check.mjs
          node scripts/emp1-issue1743-nonzero-dp-workbench-check.mjs
          npm run check:imports
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused EMP.1 browser qualification
        env:
          DEBUG: pw:webserver
        run: >-
          npx playwright test
          --config=playwright.lafea-visible.config.js
          --project=chromium
          --reporter=line
          e2e/emp1-qualification-sample-orchestration.spec.js
          e2e/emp1-professional-workflow.spec.js
          e2e/emp1-presentation-coherence.spec.js
          e2e/emp1-analytical-layout.spec.js
          e2e/emp1-benchmark-evidence.spec.js
          e2e/emp1-human-presentation-tokens.spec.js
          e2e/emp1-professional-release.spec.js
          e2e/emp1-professional-walkthrough-evidence.spec.js
