name: LAFEA.4 A2 load and BC transfer exact-head validation

on:
  pull_request:
    paths:
      - 'scripts/lafea4-a2-load-transfer-check.mjs'
      - 'scripts/lafea4-independent-pressure-resultant-authorization-check.mjs'
      - 'scripts/lafea.4-pressure-check.mjs'
      - 'scripts/lafea.4-mitc-adoption-pressure-check.mjs'
      - 'scripts/lafea-shell-compiled-execution-check.mjs'
      - 'src/core/local-shell/**'
      - 'src/workspace/lafea-shell-solver-model.js'
      - 'src/workspace/lafea-shell-midsurface-*.js'
      - 'src/workspace/lafea-shell-mesh-*.js'
      - '.github/workflows/lafea4-a2-load-bc-frame-validation.yml'

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact head and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: A2 TRI3 hand oracle and remesh load/BC transfer
        run: node scripts/lafea4-a2-load-transfer-check.mjs

      - name: Independent curved pressure resultant and first moment
        run: node scripts/lafea4-independent-pressure-resultant-authorization-check.mjs

      - name: CST/DKT pressure sense and first-moment regression
        run: node scripts/lafea.4-pressure-check.mjs

      - name: MITC3 and distorted MITC4 independent pressure integration
        run: node scripts/lafea.4-mitc-adoption-pressure-check.mjs

      - name: Compiler supported/unsupported transfer boundary
        run: node scripts/lafea-shell-compiled-execution-check.mjs

      - name: Import integrity
        run: npm run check:imports

      - name: Production build
        run: npm run build

      - name: Diff whitespace gate
        shell: bash
        run: |
          git fetch origin engineering/lafea4-a1-1758-geometry-mesh-custody --depth=1
          git diff --check FETCH_HEAD...HEAD
