name: LAFEA visible workbench qualification
on:
  pull_request:
    paths:
      - 'src/workspace/lafea-*.js'
      - 'src/lafea-app/**'
      - 'e2e/lafea-*.spec.js'
      - 'e2e/helpers/lafea-stage17-playwright.js'
      - 'e2e/fixtures/lafea-stage17-browser-fixture.js'
      - 'scripts/lafea-*.mjs'
      - '.github/workflows/lafea-visible-workbench.yml'
      - '.github/workflows/pages-vite-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visible-workbench:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QUALIFICATION_BASE: 162c88ee4715bc46c3c768c1086e74e7165bd3fb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture bounded retained-refinement diagnostics
        run: |
          node scripts/lafea-retained-bounded-adjacency-diagnostic.mjs
          node scripts/lafea-retained-mesh-edge-classification-diagnostic.mjs
          node scripts/lafea-retained-mesh-longest-edge-closure-diagnostic.mjs
      - name: Upload bounded retained-refinement diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bounded-refinement-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/lafea-retained-bounded-adjacency.json
            test-results/lafea-retained-refinement-edge-classification.json
            test-results/lafea-retained-refinement-longest-edge-closure.json
          if-no-files-found: error
          retention-days: 7
      - name: Static and projection checks
        run: |
          node --check src/workspace/lafea-engineering-overview.js
          node --check src/workspace/lafea-workbench-content.js
          node --check src/workspace/lafea-results-view.js
          node --check src/workspace/lafea-discretization-panel.js
          node --check src/workspace/lafea-analysis-settings-view.js
          node --check src/workspace/lafea-shell-solver-model.js
          node --check src/workspace/lafea-shell-preparation-projection.js
          node --check src/workspace/lafea-workbench-shell-execution-state.js
          node --check src/workspace/lafea-workbench-shell-run-actions.js
          node --check scripts/lafea-shell-compiled-execution-check.mjs
          node --check scripts/lafea-shell-response-acceptance-check.mjs
          node tests/lafea-engineering-overview.test.mjs
          node scripts/lafea-ui-analysis-settings-check.mjs
      - name: Qualify governed shell mesh compiler and execution custody
        run: |
          node scripts/lafea-shell-sample-parent-check.mjs
          node scripts/lafea-shell-workbench-route-check.mjs
          node scripts/lafea-shell-compiled-execution-check.mjs
          node scripts/lafea-shell-response-acceptance-check.mjs
      - name: Prove standalone boundary failure is inherited unchanged
        shell: bash
        run: |
          set +e
          node scripts/lafea-standalone-boundary-check.mjs > /tmp/head-boundary.log 2>&1
          head_status=$?
          rm -rf /tmp/lafea-base
          mkdir -p /tmp/lafea-base
          git archive "$QUALIFICATION_BASE" | tar -x -C /tmp/lafea-base
          archive_status=${PIPESTATUS[0]}
          if [ "$archive_status" -eq 0 ]; then
            (cd /tmp/lafea-base && node scripts/lafea-standalone-boundary-check.mjs > /tmp/base-boundary.log 2>&1)
            base_status=$?
          else
            base_status=125
            printf 'git archive failed for qualification base %s\n' "$QUALIFICATION_BASE" > /tmp/base-boundary.log
          fi
          set -e

          echo "Standalone boundary comparator: head_status=$head_status base_status=$base_status archive_status=$archive_status"
          head_error="$(grep -m1 'Error: FORBIDDEN_PRODUCT_OR_COMBINED_DEPENDENCY:' /tmp/head-boundary.log || true)"
          base_error="$(grep -m1 'Error: FORBIDDEN_PRODUCT_OR_COMBINED_DEPENDENCY:' /tmp/base-boundary.log || true)"
          printf 'HEAD_FIRST_FORBIDDEN=%s\n' "$head_error"
          printf 'BASE_FIRST_FORBIDDEN=%s\n' "$base_error"

          if [ "$head_status" -eq 0 ]; then
            echo "Candidate standalone boundary passes."
            exit 0
          fi

          if [ "$archive_status" -ne 0 ] || [ "$base_status" -eq 0 ] || [ -z "$head_error" ] || [ -z "$base_error" ] || [ "$head_error" != "$base_error" ]; then
            echo '--- candidate standalone boundary log ---'
            cat /tmp/head-boundary.log
            echo '--- exact-base standalone boundary log ---'
            cat /tmp/base-boundary.log
            exit 1
          fi

          echo "Inherited exact-base boundary failure retained without expansion:"
          echo "$head_error"
      - name: Build standalone LAFEA bundle
        run: |
          npx vite build --config vite.lafea.config.js
          node scripts/lafea-standalone-build-artifact-check.mjs
      - name: Build production Pages bundle
        run: npm run build
      - name: Install pinned Chromium runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium
      - name: Run Stage-17 and production-shell visible UI proof
        run: node scripts/lafea-stage17-browser-run.mjs
      - name: Upload visible browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-visible-workbench-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 30