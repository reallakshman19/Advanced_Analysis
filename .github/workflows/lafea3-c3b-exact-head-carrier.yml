name: LAFEA.3 C3-B exact-head diagnostic carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/lafea3-c3b-exact-head-carrier.yml'

permissions:
  contents: read

jobs:
  c3b-product-head:
    runs-on: ubuntu-latest
    env:
      PRODUCT_HEAD: ${{ github.event.pull_request.base.sha }}
      MAIN_BASE: 41df6e945789273fc327aaeca6686529a9ad8b39
      C3B_REPORT_DIR: /tmp/lafea3-c3b-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact product head and clean tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$MAIN_BASE...$PRODUCT_HEAD"

      - name: Check C3-B batch runner syntax
        run: node --check scripts/lafea.3-c3b-mesh-qualification-check.mjs

      - name: Execute exact-head C3-B qualification
        id: c3b
        continue-on-error: true
        shell: bash
        run: |
          rm -rf "$C3B_REPORT_DIR"
          mkdir -p "$C3B_REPORT_DIR"
          set +e
          node scripts/lafea.3-c3b-mesh-qualification-check.mjs \
            --expected-head "$PRODUCT_HEAD" \
            --base "$MAIN_BASE" \
            > "$C3B_REPORT_DIR/c3b-receipt.json" \
            2> "$C3B_REPORT_DIR/c3b-stderr.txt"
          status=$?
          set -e
          printf '%s\n' "$status" > "$C3B_REPORT_DIR/c3b-exit-code.txt"
          exit "$status"

      - name: Print C3-B exact-head receipt
        if: always()
        shell: bash
        run: |
          echo '=== C3-B EXIT CODE ==='
          cat "$C3B_REPORT_DIR/c3b-exit-code.txt" || true
          echo '=== C3-B RECEIPT ==='
          cat "$C3B_REPORT_DIR/c3b-receipt.json" || true
          echo '=== C3-B STDERR ==='
          cat "$C3B_REPORT_DIR/c3b-stderr.txt" || true

      - name: Upload C3-B exact-head receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lafea3-c3b-${{ env.PRODUCT_HEAD }}
          path: ${{ env.C3B_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 5

      - name: Propagate C3-B qualification result
        if: always()
        shell: bash
        run: |
          test -f "$C3B_REPORT_DIR/c3b-exit-code.txt"
          status=$(cat "$C3B_REPORT_DIR/c3b-exit-code.txt")
          if [ "$status" -ne 0 ]; then
            echo 'C3-B exact-head qualification failed; job log carries the diagnostic receipt.'
            exit "$status"
          fi
          echo 'C3-B exact-head qualification passed; job log carries candidate qualification evidence.'
